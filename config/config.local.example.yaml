# Copy to config/config.local.yaml (gitignored) for preferences you do not
# want committed. It is layered over config/config.yaml:
#   - mappings merge key by key
#   - any other value replaces the base value
#   - a key ending in "+" appends to the base list
# Values below are illustrations; replace them with your own.

# Add titles to the committed blocklist, for example people-management roles.
role_keywords_block+:
  - manager
  - supervisor

filters:
  # Replace a single value and keep the rest of the filters block.
  salary_floor: 100000

  # Cap levels at employers whose ladders run above the title.
  level_cap:
    companies: [ExampleCorp]
    floor: analyst_i
    ceiling: analyst_ii
    max_level_number: 4
    tag_unlabeled: true

# Per-family level floors. Families merge key by key, so the committed
# variants and queries stay in place.
role_families:
  soc_analyst:
    min_level: analyst_ii     # Tier 2 and up
    tag_unlabeled: true       # "SOC Analyst" with no tier -> verify_level
  detection_engineer:
    min_level: analyst_i      # entry level welcome
  # Add a query to one family without restating the committed list:
  threat_intel:
    queries+: [intelligence analyst cyber]
