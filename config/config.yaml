# Gauntlet central config.
# Everything tunable lives here so the Python and Claude layers stay generic.
# Secrets (Sheet ID, email, SMTP) live in config/secrets.env, see
# config/secrets.env.example.
# Personal preferences you do not want committed go in config/config.local.yaml
# (gitignored), layered over this file; see config/config.local.example.yaml.

# ---- Candidate filter gate (deterministic, no LLM) ----
filters:
  salary_floor: 112000          # hard floor on the posting's max (or the estimate)
  salary_target: 120000         # at or above this gets a "strong" tag
  allow_unverified_salary: true # surface roles with no listed salary, clearly tagged
  remote_types_ok:              # anything else is a dealbreaker (onsite)
    - remote
    - hybrid
  hybrid_requires_metro: true   # hybrid roles must name the metro below in their location
  unknown_mode_requires_metro: true  # no remote/hybrid statement + a named city elsewhere = fail
  geo_strict: true              # location must match location_ok unless no place is stated
  location_context: "<City of choice>"   # or set LOCATION_CONTEXT in config/secrets.env
  # Locations that fail outright (word match against the posting's location string).
  # Modify the list below to your preference
  location_block:
    - India
    - Chennai
    - Pune
    - Bengaluru
    - Hyderabad
    - Ireland
    - United Kingdom
    - Germany
    - Australia
    - Canada
    - Singapore
    - Japan
    - Israel
    - Poland
    - Romania
    - Brazil
    - Mexico
    - Saudi Arabia
    - UAE
    - GBR
    - IRL
    - DEU
    - FRA
    - ESP
    - NLD
    - CHE
    - AUS
    - CAN
    - IND
    - SGP
    - JPN
    - KOR
    - CHN
    - BRA
    - MEX
    - SAU
    - ARE
    - MYS
    - ZAF
    - CRI
  # A location must match one of these (word match). Bare "Remote" with no
  # place stated passes with a verify_location tag.
  # Modify the list below to your preference
  location_ok:
    - United States
    - United States of America
    - USA
    - US
    - Illinois
    - IL
    - Chicago
  employment_types_ok:
    - direct
    - unknown                   # surfaced but tagged for manual check
  employment_types_block:
    - contract
    - staffing
    - agency
  # Companies that are not named (not in adapters/registry.yaml and not in
  # targets_preferred) are held to salary_floor with no exceptions: the
  # posting needs a salary, listed or estimated, whose top clears the floor.
  # "Not listed" fails for them. Named companies and manual intakes keep
  # allow_unverified_salary.
  unnamed_require_salary: true
  seniority_min: analyst_ii     # analyst_i | analyst_ii | senior | lead | principal
  # Optional per-company level cap for employers whose ladders run above the
  # title (for example "Engineer 5" or "(L5)"). Off unless set, usually in
  # config.local.yaml:
  # level_cap:
  #   companies: [ExampleCorp]
  #   floor: analyst_i          # replaces seniority_min for these companies
  #   ceiling: analyst_ii       # seniority above this fails
  #   max_level_number: 4       # explicit ladder number above this fails
  #   tag_unlabeled: true       # no level in the title -> verify_level tag
  # A title with none of role_keywords_any can still pass if it contains one
  # of these AND the body mentions a role keyword. Prevents DevOps and QA
  # postings from passing just because "security engineer" appears in the body.
  title_gate_terms:
    - security
    - soc
    - incident
    - threat
    - detection
    - forensic
    - dfir
    - cyber
    - malware
    - intrusion
    - csirt
    - cybersecurity
    - infosec
    - intelligence

# ---- Target companies (preference boost, NOT a hard gate) ----
targets_preferred:
  - CrowdStrike
  - Rapid7
  - Keeper Security
  - KPMG
  - TransUnion
  - Federal Reserve Bank of Chicago
  - Mizuho Americas
  - Google
  - Amazon
  - Meta
  - Apple
  - Netflix

# ---- Role keywords (what counts as "a role for me") ----
role_keywords_any:
  - security analyst
  - soc analyst
  - security operations
  - incident response
  - incident responder
  - dfir
  - digital forensics
  - threat hunt
  - threat hunter
  - threat detection
  - detection engineer
  - detection engineering
  - malware analyst
  - malware analysis
  - cyber defense
  - security engineer
  - cloud security
  - offensive security
  - penetration test
  - red team
  - threat intelligence
  - threat intel
  - cybersecurity analyst

# ---- Role families (title variants, level floors, general-search queries) ----
# A title belongs to a family when it contains every word of one variant, in
# any order: "soc analyst" also matches "Analyst, SOC" and "SOC Tier 2
# Analyst". A word ending in * matches any ending, so "intel*" covers intel
# and intelligence. A family match counts as a role keyword in the title.
# `queries` are what the general search sends to each search source (see
# `search` below); every query costs one call per source per run.
# Optional per family, usually set in config.local.yaml:
#   min_level: analyst_i    replaces filters.seniority_min for this family
#   tag_unlabeled: true     a title with no level gets a verify_level tag
# When a title matches several families, the lowest min_level applies. A
# filters.level_cap floor still wins for its companies.
role_families:
  soc_analyst:
    variants: [soc analyst, soc engineer, security operations analyst, security operations center, cyber defense analyst]
    queries: [soc analyst, security operations center analyst, cyber defense analyst]
  detection_engineer:
    variants: [detection engineer*, siem engineer*]
    queries: [detection engineer, detection engineering, siem engineer]
  threat_intel:
    variants: [threat intel*, cyber intel*, cti]
    queries: [threat intelligence, threat intel, cyber intelligence, cti analyst]
  incident_response:
    variants: [incident respon*, dfir, csirt, cirt, digital forensic*, cyber forensic*]
    queries: [incident response, incident responder, dfir, digital forensics]
  threat_hunting:
    variants: [threat hunt*]
    queries: [threat hunter, threat hunting]
  malware_analysis:
    variants: [malware]
    queries: [malware]

role_keywords_block:              # title-only, whole-word
  - sales
  - account executive
  - account manager
  - customer success
  - solutions architect
  - solutions engineer
  - sales engineer
  - product manager
  - program manager
  - project manager
  - recruiter
  - intern
  - internship
  - unpaid
  - sdet
  - qa
  - quality assurance
  - devops
  - site reliability
  - software engineer
  - software developer
  - data engineer
  - software dev
  - software development
  - systems developer
  - systems development
  - applied scientist
  - appsec
  - application security
  - product security
  - privacy
  - compliance
  - marketing
  - solutions consultant
  - director
  - vice president
  - vp
  - head of
  - physical security
  - data center
  - loss prevention
  - personnel security
  - corporate security
  - protective services
  - guard

# ---- General search (every employer, not just the registry) ----
# After the registry pull, each role_families query is sent to the search
# APIs below. Both are official APIs with free keys; set them in
# config/secrets.env (a source without keys is skipped with a notice):
#   adzuna    ADZUNA_APP_ID, ADZUNA_APP_KEY      developer.adzuna.com
#   usajobs   USAJOBS_API_KEY, USAJOBS_EMAIL     developer.usajobs.gov
# A result at a registry company that already has a working adapter is
# dropped, since the adapter pulls the full posting. A result at any other
# named company is renamed to match it and keeps its preferred ranking.
# Everyone else is unnamed: they rank after named companies and must clear
# filters.unnamed_require_salary.
search:
  enabled: true
  max_days_old: 7               # only postings this recent
  expire_after_days: 14         # a search result not seen again this long is marked gone
  adzuna:
    enabled: true
    country: us
    results_per_page: 50        # API maximum
    distance_km: 50             # radius around location_context for the local pass
    # Two calls per query (one remote, one near location_context). The free
    # tier allows 250 calls a day and 2,500 a month; 17 queries is 34 a run.
    max_calls: 60
  usajobs:
    enabled: true
    results_per_page: 100
    public_only: true           # skip announcements open only to current federal employees

# ---- Model config ----
# Documentation only. Tailoring runs inside a Claude Code session, so the
# session's model applies. These strings record intent for a future headless
# mode and are not read by any pipeline code today.
models:
  primary: "claude-fable-5"
  fallback: "claude-opus-4-8"

# ---- Notification ----
notify:
  digest_kinds:
    - daily
    - biweekly
  email_to: ""                   # set EMAIL_TO in config/secrets.env
  digest_time: "07:30"           # local; cron / Task Scheduler triggers the run
  stale_after_days: 14           # biweekly digest lists yes-roles idle this long

# ---- Google Sheet mirror ----
sheet:
  enabled: true
  sheet_id: ""                   # set SHEET_ID in config/secrets.env
  worksheet: "pipeline"          # the working board
  archive_worksheet: "archive"   # rows retire here instead of being deleted
  archive_after_days: 8          # untouched this long -> archive tab
  gone_grace_days: 3             # posting vanished from its board this long -> archive tab
  service_account_file: "config/secrets/gsheets_sa.json"

# ---- Paths ----
paths:
  db: "data/gauntlet.db"
  master_bullets: "data/master_bullets.yaml"
  adversarial_path: "adversarial_checks_seed_prompts.md"
  output_dir: "output"
